# Cria uma Release com o SoundTuneKey.exe quando uma tag de versão é enviada:
#   git tag v0.1.0
#   git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessário para criar a Release e anexar o .exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Gerar o .exe
        shell: bash
        run: dotnet publish src/SoundTuneKey -c Release -o publish -p:Version="${GITHUB_REF_NAME#v}"

      - name: Criar a Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/SoundTuneKey.exe
          generate_release_notes: true
